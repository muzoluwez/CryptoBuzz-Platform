name: Build and Deploy CryptoBuzz Admin to Azure

on:
  push:
    branches: [ develop ]
  workflow_dispatch:

permissions:
  id-token: write      # ✅ OIDC fix
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22.x'

    - name: Install dependencies
      working-directory: ./CryptoBuzz-admin
      run: npm install --force

    - name: Build project
      working-directory: ./CryptoBuzz-admin
      env:
        VITE_APP_API_URL: ${{ secrets.VITE_APP_API_URL }}
        VITE_APP_URL: ${{ secrets.VITE_APP_URL }}
        VITE_ENV: ${{ secrets.VITE_ENV }}
        VITE_SOCKET_URL: ${{ secrets.VITE_SOCKET_URL }}
      run: |
        npm run build
        ls -la dist/

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: cryptoBuzz-admin-dist
        path: ./CryptoBuzz-admin/dist

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write   # ✅ Must have here too
      contents: read
    steps:
    - name: Download artifact
      uses: actions/download-artifact@v4
      with:
        name: cryptoBuzz-admin-dist
        path: ./dist

    - name: Azure Login (OIDC)
      uses: azure/login@v2
      with:
        client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_D7B082EC8D5B4C58A3CEB0BACD980CD6 }}
        tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_81FB42840013467ABD9191A7EEC26E9D }}
        subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_8FC9DD1EA42748F59340964CBE5CFBC2 }}

    - name: Deploy to Azure
      uses: azure/webapps-deploy@v3
      with:
        app-name: cryptoBuzz-admin-fe
        slot-name: Production
        package: .
