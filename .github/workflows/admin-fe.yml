name: Build and Deploy Vite App to Azure Web App - admin (fe)

on:
  push:
    branches:
      - develop
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      # 1️⃣ Checkout repository
      - name: Checkout code
        uses: actions/checkout@v4

      # 2️⃣ Setup Node.js
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '22.x'

      # 3️⃣ Install dependencies and build Vite (ADMIN)
      - name: Install dependencies and build (admin)
        working-directory: CryptoBuzz-admin
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
          VITE_APP_API_URL: ${{ secrets.VITE_APP_API_URL }}
          VITE_APP_NAME: ${{ secrets.VITE_APP_NAME }}
          VITE_APP_VERSION: ${{ secrets.VITE_APP_VERSION }}
          VITE_APP_CRM_API_KEY: ${{ secrets.VITE_APP_CRM_API_KEY }}
          VITE_APP_STREAM_API_KEY: ${{ secrets.VITE_APP_STREAM_API_KEY }}
        run: |
          export NODE_OPTIONS="--max-old-space-size=4096"
          npm ci
          npm run build

          # Runtime folder (same as EDU)
          mkdir runtime
          cp -r dist runtime/dist
          cp server.js runtime/

          # Runtime package.json
          echo '{
            "name": "admin-app",
            "version": "1.0.0",
            "type": "module",
            "main": "server.js",
            "scripts": {
              "start": "node server.js"
            },
            "dependencies": {
              "express": "^4.21.2"
            }
          }' > runtime/package.json

          cd runtime
          npm install --production
          zip -r ../site.zip *

      # 4️⃣ Azure Login (👉 SAME AS EDUCATOR)
      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_D7B082EC8D5B4C58A3CEB0BACD980CD6 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_81FB42840013467ABD9191A7EEC26E9D }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_8FC9DD1EA42748F59340964CBE5CFBC2 }}

      # 5️⃣ Deploy to Azure (ADMIN)
      - name: Deploy to Azure Web App (Production)
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'cryptoBuzz-admin-fe'
          slot-name: 'Production'
          package: site.zip


