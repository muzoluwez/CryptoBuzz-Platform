# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions
# Docs: https://github.com/Azure/webapps-deploy

name: Build and deploy Frontend to Azure Web App - cryptoBuzz-educator

on:
  push:
    branches:
      - develop
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '22.x'

      - name: Install dependencies
        working-directory: CryptoBuzz-edu
        run: npm install

      - name: Build project with ENV
        working-directory: CryptoBuzz-edu
        env:
          VITE_APP_API_URL: ${{ secrets.VITE_APP_API_URL }}
          VITE_APP_URL: ${{ secrets.VITE_APP_URL }}
          VITE_ENV: ${{ secrets.VITE_ENV }}
          VITE_SOCKET_URL: ${{ secrets.VITE_SOCKET_URL }}
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: CryptoBuzz-edu/dist

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: node-app

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_0CF7B85673A541B98EC1AE44D892B17F }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_E5BEEB2A5CA948E5B01EE3FAC4E76BF8 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_50D1A4407B504963974AC99F6CA3659B }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: cryptoBuzz-educator
          slot-name: Production
          package: .
