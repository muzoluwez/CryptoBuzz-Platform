name: Build and deploy Educator Server to Azure Web App

on:
  push:
    branches:
      - develop
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"

      - name: Install dependencies
        working-directory: CryptBuzz-edu
        run: npm install

      - name: Build frontend (Vite)
        working-directory: CryptBuzz-edu
        env:
          VITE_APP_API_URL: ${{ secrets.VITE_APP_API_URL }}
          VITE_APP_URL: ${{ secrets.VITE_APP_URL }}
          VITE_ENV: ${{ secrets.VITE_ENV }}
          VITE_SOCKET_URL: ${{ secrets.VITE_SOCKET_URL }}
        run: npm run build

      # ✅ Upload optimized artifact
      - name: Upload educator artifact (1 day retention)
        uses: actions/upload-artifact@v4
        with:
          name: educator-app
          path: |
            CryptBuzz-edu/dist
            CryptBuzz-edu/package.json
            CryptBuzz-edu/package-lock.json
            CryptBuzz-edu/server.js
            CryptBuzz-edu/ecosystem.config.js
          retention-days: 1

  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: educator-app
          path: .

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_0CF7B85673A541B98EC1AE44D892B17F }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_E5BEEB2A5CA948E5B01EE3FAC4E76BF8 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_50D1A4407B504963974AC99F6CA3659B }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: cryptoBuzz-educator
          slot-name: Production
          package: .



