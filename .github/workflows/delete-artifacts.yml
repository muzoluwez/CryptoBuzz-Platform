name: Delete Old Artifacts

on:
  schedule:
    - cron: "0 0 * * *" 
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete all artifacts
        uses: c-hive/gha-remove-artifacts@v1
        with:
          age: '0'
