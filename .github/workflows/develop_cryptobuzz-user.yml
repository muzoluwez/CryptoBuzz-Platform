# CI / CD Script 
name: Build and Deploy CryptoBuzz Frontend

on:
  push:
    branches:
      - develop
  workflow_dispatch:

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    name: Build and Deploy Static Web App

    steps:
      # 1️⃣ Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2️⃣ Setup Node.js (LTS)
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # 3️⃣ Enable Corepack (THIS IS CRITICAL)
      - name: Enable Corepack
        run: corepack enable

      # 4️⃣ Activate pnpm
      - name: Prepare pnpm
        run: corepack prepare pnpm@9 --activate

      # 5️⃣ Verify pnpm (safety check)
      - name: Verify pnpm
        run: pnpm --version

      # 6️⃣ Install dependencies
      - name: Install dependencies
        working-directory: CryptoBuzz-fe
        run: pnpm install --frozen-lockfile

      # 7️⃣ Build Vite app
      - name: Build app
        working-directory: CryptoBuzz-fe
        env:
          VITE_APP_API_URL: ${{ secrets.VITE_APP_API_URL }}
          VITE_APP_URL: ${{ secrets.VITE_APP_URL }}
          VITE_ENV: ${{ secrets.VITE_ENV }}
        run: pnpm run build

      # 8️⃣ Deploy to Azure Static Web Apps
      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: "CryptoBuzz-fe"
          output_location: "dist"
          skip_app_build: true
