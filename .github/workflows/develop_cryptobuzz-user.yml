name: Build and deploy Node.js app to Azure Web App - cryptobuzz-user

on:
  push:
    branches:
      - develop
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v3
        with:
          node-version: '20.x'

      - name: Enable Corepack
        run: corepack enable

      - name: Prepare pnpm
        run: corepack prepare pnpm@9 --activate

      - name: Install dependencies
        working-directory: CryptoBuzz-fe
        run: pnpm install

      - name: Build for production
        working-directory: CryptoBuzz-fe
        env:
          VITE_APP_API_URL: ${{ secrets.VITE_APP_API_URL || 'https://cryptobuzz-backend.azurewebsites.net' }}
          VITE_APP_URL: ${{ secrets.VITE_APP_URL || 'https://cryptobuzz-user.azurewebsites.net' }}
          VITE_ENV: ${{ secrets.VITE_ENV || 'production' }}
        run: pnpm run build

      - name: Prepare deployment package
        working-directory: CryptoBuzz-fe
        run: |
          # Verify dist folder exists
          if [ ! -d "dist" ]; then
            echo "Error: dist folder not found after build"
            exit 1
          fi
          # Create deployment directory
          mkdir -p deploy
          # Copy built files
          cp -r dist/* deploy/
          # Copy server files
          cp server.js deploy/
          # Create web.config to prevent Azure from running npm build
          echo '<?xml version="1.0" encoding="utf-8"?>
          <configuration>
            <system.webServer>
              <handlers>
                <add name="iisnode" path="server.js" verb="*" modules="iisnode"/>
              </handlers>
              <rewrite>
                <rules>
                  <rule name="NodeInspector" patternSyntax="ECMAScript" stopProcessing="true">
                    <match url="^server.js\/debug[\/]?" />
                  </rule>
                  <rule name="StaticContent">
                    <action type="Rewrite" url="public{REQUEST_URI}"/>
                  </rule>
                  <rule name="DynamicContent">
                    <conditions>
                      <add input="{REQUEST_FILENAME}" matchType="IsFile" negate="True"/>
                    </conditions>
                    <action type="Rewrite" url="server.js"/>
                  </rule>
                </rules>
              </rewrite>
            </system.webServer>
          </configuration>' > deploy/web.config
          # Create minimal package.json for production
          echo '{"name":"cryptobuzz-fe","type":"module","scripts":{"start":"node server.js"},"dependencies":{"express":"^5.2.1"}}' > deploy/package.json
          # Install production dependencies in deploy folder
          cd deploy && npm install --production

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: CryptoBuzz-fe/deploy

  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app

      - name: 'Deploy to Azure Web App'
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'cryptobuzz-user'
          slot-name: 'Production'
          package: .
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_27CC9091CBFE48A08595BF8C5F279372 }}
