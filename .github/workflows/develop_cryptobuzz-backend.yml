name: Build and deploy Node.js app to Azure Web App - cryptoBuzz-backend

on:
  push:
    branches:
      - develop
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v3
        with:
          node-version: '22.x'

      - name: Install dependencies
        working-directory: CryptoBuzz-be
        run: npm install

      - name: Create deployment zip
        run: |
          cd CryptoBuzz-be
          zip -r ../backend.zip .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-zip
          path: backend.zip

  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: backend-zip

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_EDC84B0317C34C789BF0A4080F1842A2 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_D74A9B2104CF4C768AA2E65BC88F0879 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_B51BF8285D9944268F77DCC868A355C5 }}

      - name: Deploy ZIP to Azure
        uses: azure/webapps-deploy@v3
        with:
          app-name: cryptoBuzz-backend
          package: backend.zip



